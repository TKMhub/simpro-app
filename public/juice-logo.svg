<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="soda-gradient" x1="100" y1="50" x2="100" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D9CDB" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Bottle Cap -->
  <rect x="85" y="10" width="30" height="15" rx="2" fill="#E0E0E0" />
  <rect x="82" y="25" width="36" height="5" rx="1" fill="#BDBDBD" />
  
  <!-- Bottle Neck -->
  <path d="M85 30 L85 50 Q75 70 60 75 L60 180 Q60 195 75 195 L125 195 Q140 195 140 180 L140 75 Q125 70 115 50 L115 30 Z" fill="#F2F2F2" opacity="0.3" stroke="#BDBDBD" stroke-width="2" />
  
  <!-- Liquid (Soda) -->
  <path d="M62 100 Q62 95 138 95 L138 180 Q138 193 125 193 L75 193 Q62 193 62 180 Z" fill="url(#soda-gradient)" opacity="0.9" />
  
  <!-- Bubbles -->
  <circle cx="90" cy="120" r="3" fill="white" opacity="0.6" />
  <circle cx="110" cy="140" r="4" fill="white" opacity="0.5" />
  <circle cx="80" cy="160" r="2" fill="white" opacity="0.7" />
  <circle cx="120" cy="170" r="3" fill="white" opacity="0.6" />
  
  <!-- Label Idea (Optional) -->
  <rect x="60" y="110" width="80" height="40" fill="white" opacity="0.2" />
</svg>